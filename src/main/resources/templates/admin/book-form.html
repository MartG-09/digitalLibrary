<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book')}"></head>
<body class="admin-body">
<aside th:replace="~{fragments/layout :: adminSidebar('books')}"></aside>
<div class="admin-shell">
<header th:replace="~{fragments/layout :: adminTopbar}"></header>
<main class="admin-content medium">
    <div class="card">
        <h1 th:text="${bookId != null} ? 'Edit book' : 'Add new book'">Add new book</h1>

        <form th:action="${bookId != null} ? @{/admin/books/{id}(id=${bookId})} : @{/admin/books}"
              th:object="${form}" method="post">
            <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
            </div>

            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}">
            <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>

            <label for="author">Author</label>
            <input type="text" id="author" th:field="*{author}">
            <div class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>

            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" placeholder="978-0-13-235088-4">
            <div class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></div>

            <label for="category">Category</label>
            <input type="text" id="category" th:field="*{category}" list="category-list" placeholder="e.g. Fiction">
            <datalist id="category-list">
                <option th:each="c : ${categories}" th:value="${c}"></option>
            </datalist>
            <div class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>

            <label for="quantity">Quantity (total copies owned)</label>
            <input type="number" id="quantity" th:field="*{quantity}" min="0">
            <div class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            <div class="hint" th:if="${bookId != null}">Copies currently issued are subtracted automatically from the available count.</div>

            <div class="form-actions">
                <button type="submit" class="btn">Save</button>
                <a class="btn btn-outline" th:href="@{/admin/books}">Cancel</a>
            </div>
        </form>
    </div>
</main>
</div>
</body>
</html>
