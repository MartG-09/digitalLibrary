<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contact')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container medium">
    <div class="card">
        <p class="eyebrow">We’re here to help</p>
        <h1>Contact the librarian</h1>
        <p class="subtitle">Send a question or request. The librarian will see it in the admin panel.</p>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/contact}" th:object="${form}" method="post">
            <label for="subject">Subject</label>
            <input type="text" id="subject" th:field="*{subject}">
            <div class="field-error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>

            <label for="message">Message</label>
            <textarea id="message" th:field="*{message}"></textarea>
            <div class="field-error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>

            <div class="form-actions">
                <button type="submit" class="btn">Send message</button>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
