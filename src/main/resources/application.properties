spring.application.name=digital-library-system

# ---------- MySQL (the same server your MySQL Workbench connects to) ----------
# The database "digital_library" is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://localhost:3306/digital_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=library_app
# Put YOUR MySQL password here, or set the DB_PASSWORD environment variable.
spring.datasource.password=MartG09@Meg

# ---------- JPA / Hibernate ----------
# "update" creates the tables on first run and adds new columns later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Library rules (change freely) ----------
library.loan-days=14
library.max-active-loans=5
library.fine-per-day=5
# \u20B9 = Indian rupee sign (the spec says 5 per day). Use \u20A6 for Naira.
library.currency-symbol=\u20B9

# ---------- First-run seed data ----------
library.admin-name=Library Admin
library.admin-email=admin@library.com
library.admin-password=Admin@123
library.seed-sample-books=true